<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Interactive Cake Scene</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="scene-container"></div>

    <div id="ui">
        <p id="prompt">Press <strong>SPACE</strong> to blow the candle 🕯️</p>

        <div id="envelope" class="hidden">
            <button id="open-envelope">Open Envelope 💌</button>
        </div>

        <div id="note" class="hidden">
            <h2>Happy Birthday Dr.Ayesha ❤️</h2>
            <p>
                May your life be filled with happiness, love, and beautiful moments.<br>
                Wishing you a magical year ahead 💌✨
                <br><br>
                <em>— Beginner coder here, I tried my best 🫠</em>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
